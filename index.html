<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather Comparison</title>
      <link rel="stylesheet" href="/styles/normalize.css">
		<script type="module" src="/modules/forms.mjs"></script>
      <link rel="stylesheet" href="/styles/style.css">
	</head>
	<body>
		<header>Weather Comparison App</header>

		<section>
			<section id="weathercard1">
				<h2>Location One</h2>
				<form id="locationOneForm">
					<label for="locationSearchOne"></label>
					<input
						type="text"
						id="locationSearchOne"
						name="locationSearchOne"
						placeholder="Enter Location" />
					<button type="submit">Search Location</button>
				</form>
				<p id="locationOne">Waiting...</p>
				<p id="temperatureOne">Waiting...</p>
			</section>

			<section id="weathercard2">
				<h2>Location Two</h2>
				<form id="locationTwoForm">
					<label for="locationSearchTwo"></label>
					<input
						type="text"
						id="locationSearchTwo"
						name="locationSearchTwo"
						placeholder="Enter Location" />
					<button type="submit">Search Location</button>
				</form>
				<p id="locationTwo">Waiting...</p>
				<p id="temperatureTwo">Waiting...</p>
			</section>
		</section>

		<footer>Brant Martin</footer>
	</body>
</html>
